<!DOCTYPE html>

<html lang="pl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Koszyk | projektDemo</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

  <script
    src="../assets/js/products.js"
    defer
  ></script>

  <script
    src="../assets/js/store.js"
    defer
  ></script>

  <script
    src="../assets/js/cart-page.js"
    defer
  ></script>

</head>


<body>

<header class="site-header">

  <div class="container">

    <nav class="navigation">

      <a
        class="logo"
        href="../index.html"
      >
        projektDemo
      </a>

      <div class="nav-links">

        <a href="../index.html">
          Strona główna
        </a>

        <a href="../sklep/">
          Sklep
        </a>

        <a href="./">
          Koszyk
          <span
            class="cart-badge"
            data-cart-count
          >
            0
          </span>
        </a>

      </div>

    </nav>

  </div>

</header>


<main>

<section class="cart-page">

  <div class="container">

    <p class="eyebrow">
      projektDemo / koszyk
    </p>

    <h1>Twój koszyk</h1>


    <div
      id="cart-empty"
      class="cart-empty"
      hidden
    >

      <p>
        Twój koszyk jest pusty.
      </p>

      <a
        class="button"
        href="../sklep/"
      >
        Przejdź do sklepu
      </a>

    </div>


    <div id="cart-content">

      <div
        id="cart-items"
        class="cart-items"
      ></div>


      <aside
        id="cart-summary"
        class="cart-summary"
      >

        <h2>Podsumowanie</h2>

        <div class="summary-row">

          <span>Produkty</span>

          <strong
            id="cart-total"
          >
            0 zł
          </strong>

        </div>

        <div class="summary-row">

          <span>Dostawa</span>

          <strong>
            0,00 zł
          </strong>

        </div>

        <div
          class="summary-row summary-total"
        >

          <span>Razem</span>

          <strong
            id="cart-grand-total"
          >
            0 zł
          </strong>

        </div>

        <a
          class="checkout-button"
          href="../checkout/"
        >
          Przejdź do kasy
        </a>

      </aside>

    </div>

  </div>

</section>

</main>


<footer class="site-footer">

  <div class="container">
    <p>projektDemo © 2026</p>
  </div>

</footer>

</body>

</html>
